<header class="header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <i class="fas fa-briefcase logo-icon"></i>
      <span class="logo-text">Job<span class="logo-accent">World</span></span>
    </div>

    <!-- Navigation Menu -->
    <nav class="nav" [class.nav-open]="mobileMenuOpen">
      <a href="#" class="nav-link">Home</a>
      <a href="#" class="nav-link">Jobs</a>
      <a href="#" class="nav-link">Companies</a>
      <a href="#" class="nav-link">Services</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <a routerLink="/login" class="btn-login">Login</a>
      <a routerLink="/signup" class="btn-register">Register</a>
      <!-- Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Nav Overlay -->
  <div class="mobile-nav" [class.open]="mobileMenuOpen">
    <a href="#" class="mobile-nav-link" (click)="toggleMenu()">Home</a>
    <a href="#" class="mobile-nav-link" (click)="toggleMenu()">Jobs</a>
    <a href="#" class="mobile-nav-link" (click)="toggleMenu()">Companies</a>
    <a href="#" class="mobile-nav-link" (click)="toggleMenu()">Services</a>
    <div class="mobile-nav-actions">
      <a routerLink="/login" class="btn-login" (click)="toggleMenu()">Login</a>
      <a routerLink="/signup" class="btn-register" (click)="toggleMenu()">Register</a>
    </div>
  </div>
</header>
