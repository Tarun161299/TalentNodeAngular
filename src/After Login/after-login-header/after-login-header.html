<header class="header">
  <h1>Talent Node</h1>
  <div class="profile-menu">
  <!-- Hidden checkbox to handle click -->
  <input type="checkbox" id="toggleMenu" hidden>

  <!-- Profile Button -->
  <label for="toggleMenu" class="profile-btn">
    <div class="avatar">{{ UserName ? UserName[0] : '' }}</div>
    <div class="profile-info">
      <div class="name">{{UserName}}</div>
      <div class="designation">{{RoleName}}</div>
    </div>
    <div class="arrow">&#9662;</div>
  </label>

  <!-- Dropdown Menu -->
  <div class="dropdown">
    <div class="dropdown-item">
      <span  (click)="Logout()" class="icon">&#128274;</span> Logout
    </div>
    <div class="dropdown-item">
      <span  class="icon">&#128100;</span> Profile
    </div>
    <div class="dropdown-item">
      <span class="icon">&#9881;</span> Settings
    </div>
  </div>
</div>

</header>
